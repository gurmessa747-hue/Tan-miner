<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TAN Miner</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { margin:0; padding:16px; background:#d4a017; color:#3b2a00; font-family:Arial; text-align:center; }
    .coin { width:100px; height:100px; line-height:100px; margin:16px auto; border-radius:50px; background:#f5d76e; font-weight:bold; font-size:28px; }
    button { width:100%; height:46px; margin:6px 0; border:0; background:#ffe082; font-weight:bold; font-size:15px; }
    p { margin:6px 0; }
    h3 { margin:18px 0 8px; }
    .box { background:rgba(255,255,255,.25); padding:10px; margin-top:10px; text-align:left; }
    .box p { text-align:left; word-break:break-all; }
    #ton-connect { margin:8px 0; min-height:40px; }
  </style>
</head>
<body>
  <p>TAN Miner · Lv <span id="lv">1</span>/500</p>
  <div id="ton-connect"></div>
  <button onclick="pasteWallet()">Or paste TON address</button>

  <div class="coin">TAN</div>
  <p id="pending">+0.0000 TAN</p>
  <p>App balance: <span id="bal">0.00</span> TAN</p>
  <p>Wallet TAN: <span id="chain">0.00</span></p>
  <p>Boost: x<span id="boost">1.00</span></p>
  <p id="info">Idle</p>
  <button onclick="startMine()">START TAN MINING</button>
  <button onclick="claim()">CLAIM TAN</button>
  <button onclick="upgrade()">UPGRADE</button>

  <h3>Tasks</h3>
  <button onclick="task('tg',25)">Join TAN channel +25</button>
  <button onclick="task('x',25)">Follow TAN on X +25</button>
  <button onclick="task('share',15)">Share invite +15</button>
  <button onclick="task('wal',40)">Connect wallet +40</button>

  <h3>Friends / StartApp</h3>
  <div class="box">
    <p id="ref"></p>
    <button onclick="copyRef()">Copy invite link</button>
    <p>Opened with ref: <span id="refused">no</span></p>
  </div>

  <script>
    var BOT = "TANMINER_BOT";
    var JETTON = "EQAm7g9TfpInfWprTLjRSL4PZGm9UpOq05NuoakjzuUYw4V1";
    var MAX = 500;
    var tg = window.Telegram && window.Telegram.WebApp;
    if (tg) { try { tg.ready(); tg.expand(); } catch(e) {} }

    var s = { bal:0, pend:0, lv:1, on:0, t:Date.now(), wallet:"", chain:0, tasks:{} };
    try { s = JSON.parse(localStorage.getItem("tan7") || "null") || s; } catch(e) {}

    function uid() {
      try { return String(tg.initDataUnsafe.user.id); } catch(e) { return "local"; }
    }
    function hs(){ return 0.2 * Math.pow(1.015, s.lv-1); }
    function cost(){ return Math.floor(20 * Math.pow(s.lv+1, 1.35)); }
    function boost(){ return 1 + ((s.bal||0)+(s.chain||0))/10000; }
    function tick(){
      if(!s.on) return;
      var n = Date.now();
      s.pend += hs() * 0.001 * boost() * ((n-s.t)/1000);
      s.t = n;
    }
    function save(){ try { localStorage.setItem("tan7", JSON.stringify(s)); } catch(e) {} }
    function draw(){
      tick();
      document.getElementById("pending").innerHTML = "+"+s.pend.toFixed(4)+" TAN";
      document.getElementById("bal").innerHTML = s.bal.toFixed(2);
      document.getElementById("chain").innerHTML = Number(s.chain||0).toFixed(2);
      document.getElementById("boost").innerHTML = boost().toFixed(2);
      document.getElementById("lv").innerHTML = s.lv;
      document.getElementById("info").innerHTML = (s.on?"Mining":"Idle")+" · "+(hs()*boost()).toFixed(4)+" TH/s";
      document.getElementById("ref").innerHTML = "https://t.me/"+BOT+"?startapp=ref_"+uid();
      save();
    }

    function startMine(){ s.on=1; s.t=Date.now(); draw(); }
    function claim(){ tick(); s.bal+=s.pend; s.pend=0; s.on=0; draw(); }
    function upgrade(){
      if(s.lv>=MAX){ alert("Max 500"); return; }
      var c=cost();
      if(s.bal<c){ alert("Need "+c+" TAN"); return; }
      s.bal-=c; s.lv++; draw();
    }
    function task(id, reward){
      if(s.tasks[id]){ alert("Already claimed"); return; }
      if(id==="wal" && !s.wallet){ alert("Connect or paste wallet first"); return; }
      if(id==="share") copyRef();
      s.tasks[id]=1; s.bal+=reward; draw();
    }
    function copyRef(){
      var link = "https://t.me/"+BOT+"?startapp=ref_"+uid();
      if(navigator.clipboard) navigator.clipboard.writeText(link);
      alert(link);
    }
    function pasteWallet(){
      var a = prompt("Paste TON wallet address");
      if(a){ s.wallet=a; loadChain(); draw(); }
    }

    function loadChain(){
      if(!s.wallet) return;
      fetch("https://tonapi.io/v2/accounts/"+s.wallet+"/jettons/"+JETTON)
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(d){
          if(!d) return;
          var raw = d.balance || "0";
          var dec = (d.jetton && d.jetton.decimals != null) ? Number(d.jetton.decimals) : 9;
          s.chain = Number(raw) / Math.pow(10, dec);
          draw();
        })
        .catch(function(){});
    }

    try {
      var start = tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param;
      if(start && start.indexOf("ref_")==0 && !localStorage.getItem("tan-ref-used")){
        localStorage.setItem("tan-ref-used", start);
        s.bal += 10;
        document.getElementById("refused").innerHTML = start;
      }
    } catch(e) {}

    draw();
    loadChain();
    setInterval(draw, 500);
    setInterval(loadChain, 30000);

    /* TON Connect: works only after you set a REAL domain below */
    var MANIFEST = "https://YOUR_DOMAIN/tonconnect-manifest.json";
    if (MANIFEST.indexOf("YOUR_DOMAIN") === -1) {
      var sc = document.createElement("script");
      sc.src = "https://unpkg.com/@tonconnect/ui@2/dist/tonconnect-ui.min.js";
      sc.onload = function(){
        try {
          var ui = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: MANIFEST,
            buttonRootId: "ton-connect"
          });
          ui.onStatusChange(function(w){
            if(w && w.account && w.account.address){
              s.wallet = w.account.address;
              loadChain(); draw();
            }
          });
        } catch(e) {}
      };
      document.body.appendChild(sc);
    }
  </script>
</body>
</html>

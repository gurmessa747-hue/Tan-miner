<html lang="en">

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: radial-gradient(circle at 50% 0%, #fff3b0 0%, transparent 45%),

      min-height: 100vh;
      padding: 12px 12px 84px;

    }
    .coin {
      width: 160px; height: 160px; margin: 18px auto;

      background: radial-gradient(circle at 35% 30%, #fff6c8, #e0b000 55%, #b8860b);
      display:grid; place-items:center;

      width: 100%; border:0; border-radius:14px; padding:14px; font-weight:800;
    }
    button.main {
      background: linear-gradient(180deg, #ffe082, #d4a017);
      color:#3b2a00; margin:10px 0 8px;
    }
    button.ghost, .task button {
      background: rgba(255,255,255,.28);
      border: 1px solid rgba(120,80,0,.2);
      color:#3b2a00; margin:6px 0;
    }

      background: rgba(255,255,255,.22);
      border: 1px solid rgba(120,80,0,.18);
      border-radius: 16px; padding: 12px; margin-top: 10px;
    }

    .task button { width:auto; padding:8px 12px; }

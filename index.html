<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Tan miner</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
  <style>
    :root {
      --bg: #0f1218;
      --card: #1a2030;
      --text: #f4f7fb;
      --muted: #9aa7b8;
      --accent: #2ea6ff;
      --good: #3dd68c;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    body { padding: 16px 16px 28px; }
    .wrap { max-width: 420px; margin: 0 auto; }
    h1 { margin: 8px 0 4px; font-size: 28px; }
    .sub { color: var(--muted); margin-bottom: 18px; }
    .card {
      background: var(--card);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 14px;
    }
    .coins {
      font-size: 40px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .label { color: var(--muted); margin-bottom: 6px; }
    .row { display: flex; gap: 10px; }
    button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      background: var(--accent);
    }
    button:disabled { opacity: 0.55; }
    .mine { background: #3b82f6; }
    .ad { background: #16a34a; }
    #status { margin-top: 10px; color: var(--muted); min-height: 20px; }
    .ok { color: var(--good); }
    .bad { color: #ff7b7b; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Tan miner</h1>
    <div class="sub">Mine coins. Watch an ad for a bonus.</div>

    <div class="card">
      <div class="label">Your coins</div>
      <div class="coins" id="coins">0</div>
    </div>

    <div class="card">
      <div class="row">
        <button class="mine" id="mineBtn">Mine +1</button>
        <button class="ad" id="adBtn">Watch ad +25</button>
      </div>
      <div id="status">Ready</div>
    </div>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      try { tg.setHeaderColor("#0f1218"); } catch (e) {}
    }

    const coinsEl = document.getElementById("coins");
    const statusEl = document.getElementById("status");
    const mineBtn = document.getElementById("mineBtn");
    const adBtn = document.getElementById("adBtn");

    let coins = Number(localStorage.getItem("tan_coins") || 0);

    function render() {
      coinsEl.textContent = coins;
      localStorage.setItem("tan_coins", String(coins));
    }

    function setStatus(text, type) {
      statusEl.className = type || "";
      statusEl.textContent = text;
    }

    const AdController = window.Adsgram.init({
      blockId: "47920",
      debug: false
    });

    mineBtn.addEventListener("click", function () {
      coins += 1;
      render();
      setStatus("Mined +1");
    });

    adBtn.addEventListener("click", function () {
      adBtn.disabled = true;
      setStatus("Loading ad...");

      AdController.show()
        .then(function () {
          coins += 25;
          render();
          setStatus("Ad finished. +25 coins", "ok");
        })
        .catch(function (err) {
          setStatus("Ad closed or failed. No reward", "bad");
          console.log(err);
        })
        .finally(function () {
          adBtn.disabled = false;
        });
    });

    render();
  </script>
</body>
</html>

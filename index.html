<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>TAN Miner</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, sans-serif;
      background: #c9a227;
      color: #3b2a00;
    }
    #app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: linear-gradient(#f6d365, #8a6a12);
    }
    #header, #tabs {
      height: 56px;
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
    }
    #tabs {
      justify-content: stretch;
      gap: 6px;
      padding-bottom: 8px;
    }
    #main {
      flex: 1;
      overflow: auto;
      padding: 8px 14px;
    }
    .row {
      margin: 8px 0;
      text-align: center;
    }
    .coin {
      width: 110px;
      height: 110px;
      line-height: 110px;
      margin: 8px auto;
      border-radius: 55px;
      background: #e0b000;
      font-size: 32px;
      font-weight: 800;
      text-align: center;
    }
    button {
      width: 100%;
      height: 44px;
      margin: 6px 0;
      border: 0;
      border-radius: 12px;
      font-weight: 800;
      background: #ffe082;
      color: #3b2a00;
    }
    #tabs button {
      width: 33%;
      margin: 0;
      background: rgba(255,255,255,.25);
    }
    #tabs button.on { background: #ffe082; }
    .small {
      font-size: 13px;
      margin: 5px 0;
      text-align: center;
    }
    .task {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,.25);
      border-radius: 10px;
      padding: 8px;
      margin: 6px 0;
    }
    .task button {
      width: 70px;
      height: 34px;
      margin: 0;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="header">
      <div>Lv <span id="level">1</span>/500</div>
      <button id="walletBtn" style="width:auto;height:34px;padding:0 10px;">Wallet</button>
    </div>

    <div id="main">
      <div id="page-mine">
        <div class="coin">TAN</div>
        <div id="pending" class="row">+0.0000 TAN</div>
        <div class="small">Balance: <span id="balance">0.00</span> TAN</div>
        <div class="small">Wallet TAN: <span id="onchain">0.00</span></div>
        <div class="small">Boost: x<span id="boost">1.00</span> · <span id="hs">0.20</span> TH/s</div>
        <div class="small" id="status">Idle</div>
        <button id="startBtn">START TAN MINING</button>
        <button id="claimBtn">CLAIM TAN</button>
        <button id="upgradeBtn">Upgrade miner</button>
      </div>

      <div id="page-tasks" style="display:none;">
        <div id="tasks"></div>
      </div>

      <div id="page-friends" style="display:none;">
        <div class="small">Invite link</div>
        <div id="refLink" class="small"></div>
        <button id="copyRef">Copy link</button>
        <div class="small">Referrals: <span id="refs">0</span></div>
      </div>
    </div>

    <div id="tabs">
      <button id="tab-mine" class="on">Mine</button>
      <button id="tab-tasks">Tasks</button>
      <button id="tab-friends">Friends</button>
    </div>
  </div>

<script>
  var BOT = "TANMINER_BOT";
  var MAX = 500;
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  function hs(lv) { return 0.20 * Math.pow(1.015, lv - 1); }
  function cost(lv) { return lv <= 1 ? 0 : Math.floor(20 * Math.pow(lv, 1.35)); }

  var TASKS = [
    { id: "tg", title: "Join TAN channel", reward: 25 },
    { id: "x", title: "Follow TAN on X", reward: 25 },
    { id: "share", title: "Share invite link", reward: 15 },
    { id: "wallet", title: "Connect TON wallet", reward: 40 }
  ];

  var state = JSON.parse(localStorage.getItem("tan-miner-v4") || "null") || {
    balance: 0, pending: 0, level: 1, mining: false, lastTick: Date.now(),
    wallet: null, onchainTan: 0, tasksDone: {}, refs: []
  };

  function save() { localStorage.setItem("tan-miner-v4", JSON.stringify(state)); }
  function uid() {
    return String((tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) || "local");
  }
  function boost() { return 1 + ((state.balance || 0) + (state.onchainTan || 0)) / 10000; }

  function accrue() {
    if (!state.mining) return;
    var now = Date.now();
    state.pending += hs(state.level) * 0.001 * boost() * ((now - state.lastTick) / 1000);
    state.lastTick = now;
  }

  function render() {
    accrue();
    document.getElementById("pending").textContent = "+" + state.pending.toFixed(4) + " TAN";
    document.getElementById("balance").textContent = state.balance.toFixed(2);
    document.getElementById("onchain").textContent = Number(state.onchainTan || 0).toFixed(2);
    document.getElementById("boost").textContent = boost().toFixed(2);
    document.getElementById("hs").textContent = (hs(state.level) * boost()).toFixed(4);
    document.getElementById("level").textContent = state.level;
    document.getElementById("status").textContent = state.mining ? "Mining TAN..." : "Idle";
    document.getElementById("startBtn").textContent = state.mining ? "MINING TAN" : "START TAN MINING";
    document.getElementById("upgradeBtn").textContent = state.level >= MAX ? "Max level 500" : "Upgrade Lv " + (state.level + 1) + " (" + cost(state.level + 1) + " TAN)";
    document.getElementById("refLink").textContent = "https://t.me/" + BOT + "?startapp=ref_" + uid();
    document.getElementById("refs").textContent = state.refs.length;
    document.getElementById("walletBtn").textContent = state.wallet ? "Connected" : "Wallet";
    save();
  }

  function show(name) {
    document.getElementById("page-mine").style.display = name === "mine" ? "block" : "none";
    document.getElementById("page-tasks").style.display = name === "tasks" ? "block" : "none";
    document.getElementById("page-friends").style.display = name === "friends" ? "block" : "none";
    document.getElementById("tab-mine").className = name === "mine" ? "on" : "";
    document.getElementById("tab-tasks").className = name === "tasks" ? "on" : "";

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tan Miner</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
  <style>
    :root {
      --bg:#070b12; --surface:#121826; --text:#f3f6fb; --muted:#8b98a8;
      --accent:#f5b942; --btn-text:#1a1408; --line:#243044; --good:#3ddc97;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:system-ui,-apple-system,Segoe UI,sans-serif;
      background:radial-gradient(1200px 500px at 50% -10%,#3a2a12,var(--bg));
      color:var(--text);min-height:100vh;
      padding:calc(12px + env(safe-area-inset-top)) 16px calc(92px + env(safe-area-inset-bottom));
    }
    header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .brand{font-weight:900;letter-spacing:.08em;font-size:14px}
    #tc-btn{transform:scale(.86);transform-origin:right center}
    .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .card{background:color-mix(in srgb,var(--surface) 92%,black);border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:8px}
    .label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
    .value{font-size:20px;font-weight:800;margin-top:4px}
    .core-wrap{display:grid;place-items:center;margin:14px 0 8px}
    .core{
      width:190px;height:190px;border-radius:50%;border:3px solid var(--accent);
      background:radial-gradient(circle at 38% 30%,#ffe08a,#d18a10 46%,#2a1c08 78%);
      box-shadow:0 0 48px rgba(245,185,66,.32);color:#1a1408;font-weight:900;font-size:20px
    }
    .core.off{filter:grayscale(.7);box-shadow:none}
    .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
    button.act{
      border:0;border-radius:12px;padding:10px 12px;font-weight:800;
      background:var(--accent);color:var(--btn-text);white-space:nowrap
    }
    button.act:disabled{opacity:.45}
    .muted{color:var(--muted);font-size:12px}
    .hidden{display:none!important}
    .bar{height:8px;background:#1b2433;border-radius:99px;overflow:hidden;margin-top:8px}
    .bar>i{display:block;height:100%;width:0;background:var(--accent)}
    .me{color:var(--accent)}
    .tabs{
      position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;
      padding:10px 16px calc(10px + env(safe-area-inset-bottom));
      background:color-mix(in srgb,var(--bg) 90%,black)
    }
    .tabs button{flex:1;border:0;border-radius:12px;padding:12px;background:var(--surface);color:var(--text);font-weight:800}
    .tabs button.on{background:var(--accent);color:var(--btn-text)}
    .pill{color:var(--good);font-weight:800;font-size:12px}
    .list .row{padding:10px 0;border-bottom:1px solid var(--line)}
  </style>
</head>
<body>
  <header>
    <div class="brand">TAN MINER</div>
    <div id="tc-btn"></div>
  </header>

  <section id="mineView">
    <div class="stats">
      <div class="card"><div class="label">Unclaimed</div><div class="value" id="bal">0</div></div>
      <div class="card"><div class="label">Hashrate</div><div class="value" id="rate">0 H/s</div></div>
      <div class="card"><div class="label">Claimed</div><div class="value" id="claimed">0</div></div>
      <div class="card"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
    </div>

    <div class="core-wrap"><button class="core" id="core">AUTO ON</button></div>
    <p class="muted" id="status"></p>
    <p class="muted" id="offlineNote"></p>

    <div class="card row">
      <div>
        <div class="label">Claim</div>
        <div class="muted" id="claimNote">Connect wallet to claim</div>
      </div>
      <button class="act" id="claimBtn">Claim</button>
    </div>

    <div class="card row">
      <div>
        <div class="label">Withdraw TAN</div>
        <div class="muted" id="wdNote">Min 1,000 claimed</div>
      </div>
      <button class="act" id="wdBtn">Withdraw</button>
    </div>

    <div class="card row">
      <div>
        <div class="label">Daily chest</div>
        <div class="muted" id="chestNote">Open once per day</div>
      </div>
      <button class="act" id="chestBtn">Open</button>
    </div>

    <div class="card">
      <div class="label">Holder boost · Tanola TAN</div>
      <div class="row" style="margin-top:6px">
        <div class="muted" id="holdStatus">Connect wallet</div>
        <div class="pill" id="holdMult">1.00x</div>
      </div>
      <div class="bar"><i id="holdBar"></i></div>
      <div class="muted" id="holdNext" style="margin-top:6px"></div>
    </div>

    <div class="card row">
      <div>
        <div class="label">Ad boost</div>
        <div class="muted" id="adStatus">Watch ad · 2x / 15 min</div>
      </div>
      <button class="act" id="adBtn">Watch ad</button>
    </div>

    <div class="card row">
      <div>
        <div class="label">Referral</div>
        <div class="muted" id="refStatus">Invite · +10% hashrate</div>
      </div>
      <button class="act" id="refBtn">Invite</button>
    </div>
  </section>

  <section id="boardView" class="hidden">
    <h2 style="margin:6px 0 8px">Leaderboard</h2>
    <p class="muted" id="boardGate"></p>
    <p class="muted" id="myRank"></p>
    <div class="list" id="board"></div>
  </section>

  <nav class="tabs">
    <button class="on" data-tab="mine">Mine</button>
    <button data-tab="board">Leaders</button>
  </nav>

<script>
const CONFIG = {
  APP_URL: "https://tan-miner.vercel.app",
  MANIFEST_URL: "https://tan-miner.vercel.app/tonconnect-manifest.json",
  BOT_LINK: "https://t.me/YOUR_BOT/YOUR_APP",
  ADSGRAM_BLOCK_ID: "YOUR-ADSGRAM-BLOCK-ID",
  TAN_MASTER: "EQAm7g9TfpInfWprTLjRSL4PZGm9UpOq05NuoakjzuUYw4V1",
  TAN_DECIMALS: 9,
  MIN_WITHDRAW: 1000,
  AD_MS: 15 * 60 * 1000,
  ALLOW_AD_SIMULATION: true,
  BASE_HASH: 8,
  OFFLINE_CAP_HOURS: 8,
  HOLD_TIERS: [0, 100, 1000, 10000, 100000],
  HOLD_MULT: [1, 1.1, 1.25, 1.5, 2]
};

const tg = window.Telegram?.WebApp;
const user = tg?.initDataUnsafe?.user;
const myId = String(user?.id || "guest");
tg?.ready(); tg?.expand();
tg?.setHeaderColor?.("secondary_bg_color");
tg?.setBackgroundColor?.("bg_color");
const theme = tg?.themeParams || {};
const R = document.documentElement;
if (theme.bg_color) R.style.setProperty("--bg", theme.bg_color);
if (theme.secondary_bg_color) R.style.setProperty("--surface", theme.secondary_bg_color);
if (theme.text_color) R.style.setProperty("--text", theme.text_color);
if (theme.hint_color) R.style.setProperty("--muted", theme.hint_color);
if (theme.button_color) R.style.setProperty("--accent", theme.button_color);

const KEY = "tan-miner-final-v1";
const state = load();
let wallet = null, ads = null, lastTick = Date.now();

function today(){ return new Date().toISOString().slice(0,10); }
function base(){
  return {
    tan:0, claimed:0, last:Date.now(), on:true,
    adBoostUntil:0, tanHeld:0, streak:0, lastChest:"",
    referredBy:"", refBoost:false,
    name: user?.username || user?.first_name || "Miner"
  };
}
function load(){
  try { return Object.assign(base(), JSON.parse(localStorage.getItem(KEY)||"{}")); }
  catch { return base(); }
}
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }
function fmt(n){ return Math.floor(n).toLocaleString(); }
function left(ms){
  const s = Math.max(0, Math.ceil(ms/1000));
  return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
}

function applyReferral(){
  const p = tg?.initDataUnsafe?.start_param || "";
  if (p.startsWith("ref") && p.slice(3) && p.slice(3)!==myId && !state.referredBy){
    state.referredBy = p.slice(3);
    state.refBoost = true;
  }
}

function holderInfo(bal){
  const t=CONFIG.HOLD_TIERS, m=CONFIG.HOLD_MULT;
  let i=0;
  while(i<t.length-1 && bal>=t[i+1]) i++;
  const next=t[i+1], prev=t[i];
  const progress = next ? Math.min(1,(bal-prev)/(next-prev)) : 1;
  return {mult:m[i], next, progress, i};
}
function multipliers(){
  const ad = Date.now()<state.adBoostUntil ? 2 : 1;
  const hold = holderInfo(state.tanHeld).mult;
  const ref = state.refBoost ? 1.1 : 1;
  return {ad,hold,ref,total:ad*hold*ref};
}
function hashrate(){ return CONFIG.BASE_HASH * multipliers().total; }
function credit(sec){
  if(!state.on || sec<=0) return 0;
  const earned = hashrate()*sec;
  state.tan += earned;
  return earned;
}
function settleOffline(){
  const now=Date.now();
  const gone=Math.max(0,(now-(state.last||now))/1000);
  const cap=CONFIG.OFFLINE_CAP_HOURS*3600;
  const used=Math.min(gone,cap);
  const earned=credit(used);
  state.last=now; lastTick=now;
  document.getElementById("offlineNote").textContent =
    earned>0 ? ("Offline +"+earned.toFixed(2)+" TAN"+(gone>cap?" (8h cap)":"")) : "";
}

function render(){
  const h = holderInfo(state.tanHeld);
  document.getElementById("bal").textContent = fmt(state.tan);
  document.getElementById("claimed").textContent = fmt(state.claimed);
  document.getElementById("rate").textContent = hashrate().toFixed(1)+" H/s";
  document.getElementById("streak").textContent = state.streak+"d";
  const core=document.getElementById("core");
  core.textContent = state.on ? "AUTO ON" : "AUTO OFF";
  core.classList.toggle("off", !state.on);
  document.getElementById("status").textContent = state.on ? "Auto-mining. Offline cap 8 hours." : "Miner off.";

  document.getElementById("claimBtn").disabled = !(wallet && state.tan>=1);
  document.getElementById("claimNote").textContent = wallet
    ? "Move unclaimed into claimed balance"
    : "Connect TON wallet to claim";

  const need = CONFIG.MIN_WITHDRAW - Math.floor(state.claimed);
  document.getElementById("wdBtn").disabled = !(wallet && state.claimed>=CONFIG.MIN_WITHDRAW);
  document.getElementById("wdNote").textContent = !wallet
    ? "Connect wallet first"
    : (need>0 ? ("Need "+need.toLocaleString()+" more claimed") : "Ready · min 1,000 Tanola TAN");

  const chestReady = state.lastChest !== today();
  document.getElementById("chestBtn").disabled = !chestReady;
  document.getElementById("chestNote").textContent = chestReady
    ? ("Ready · +"+(10+state.streak*5)+" TAN")
    : "Come back tomorrow";

  const adOn = Date.now()<state.adBoostUntil;
  document.getElementById("adStatus").textContent = adOn ? ("ON · "+left(state.adBoostUntil-Date.now())) : "Watch ad · 2x / 15 min";
  document.getElementById("adBtn").disabled = adOn;

  document.getElementById("holdMult").textContent = h.mult.toFixed(2)+"x";
  document.getElementById("holdStatus").textContent = wallet ? ("Holding "+fmt(state.tanHeld)+" TAN") : "Connect wallet & hold TAN";
  document.getElementById("holdBar").style.width = Math.round(h.progress*100)+"%";
  document.getElementById("holdNext").textContent = h.next
    ? (fmt(Math.max(0,h.next-state.tanHeld))+" TAN to "+CONFIG.HOLD_MULT[h.i+1].toFixed(2)+"x")
    : "Max holder tier";

  document.getElementById("refStatus").textContent = state.refBoost ? "Invite active · +10%" : "Share link. Friend gets +10%.";
  tg?.MainButton?.setText(state.on ? "Stop miner" : "Start miner");
  tg?.MainButton?.show();
  save();
}

function toggle(){
  state.on=!state.on;
  state.last=lastTick=Date.now();
  tg?.HapticFeedback?.impactOccurred("medium");
  render();
}
function claim(){
  if(!wallet || state.tan<1) return;
  const amt=Math.floor(state.tan);
  state.tan-=amt; state.claimed+=amt;
  tg?.showAlert?.("Claimed "+amt.toLocaleString()+" TAN.");
  tg?.HapticFeedback?.notificationOccurred("success");
  render();
}
function withdraw(){
  if(!wallet || state.claimed<CONFIG.MIN_WITHDRAW) return;
  const amt=Math.floor(state.claimed);
  state.claimed-=amt;
  const q=JSON.parse(localStorage.getItem("tan-withdraws")||"[]");
  q.unshift({ts:Date.now(), amt, to:wallet, jetton:CONFIG.TAN_MASTER, id:myId, status:"pending_treasury"});
  localStorage.setItem("tan-withdraws", JSON.stringify(q.slice(0,50)));
  tg?.showAlert?.(
    amt.toLocaleString()+" TAN withdraw requested to\n"+
    wallet.slice(0,6)+"..."+wallet.slice(-4)+
    "\n\nToken: Tanola TAN\n"+CONFIG.TAN_MASTER+
    "\nMin 1,000.\nPaid from treasury. This page cannot mint tokens."
  );
  tg?.HapticFeedback?.notificationOccurred("success");
  render();
}
function openChest(){
  if(state.lastChest===today()) return;
  const y=new Date(Date.now()-86400000).toISOString().slice(0,10);
  state.streak = state.lastChest===y ? state.streak+1 : 1;
  const reward=10+state.streak*5;
  state.tan+=reward;
  state.lastChest=today();
  tg?.showAlert?.("Day "+state.streak+" chest: +"+reward+" TAN");
  tg?.HapticFeedback?.notificationOccurred("success");
  render();
}
function invite(){
  const link=CONFIG.BOT_LINK+"?startapp=ref"+encodeURIComponent(myId);
  if(tg?.openTelegramLink){
    tg.openTelegramLink("https://t.me/share/url?url="+encodeURIComponent(link)+"&text="+encodeURIComponent("Mine TAN with me"));
  } else {
    navigator.clipboard?.writeText(link);
    tg?.showAlert?.("Invite link copied");
  }
}
async function watchAd(){
  if(Date.now()<state.adBoostUntil) return;
  const grant=()=>{ state.adBoostUntil=Date.now()+CONFIG.AD_MS; render(); };
  if(ads){ try{ await ads.show(); grant(); return; }catch{ if(!CONFIG.ALLOW_AD_SIMULATION) return; } }
  if(CONFIG.ALLOW_AD_SIMULATION) grant();
}
async function refreshHold(){
  if(!wallet){ state.tanHeld=0; render(); return; }
  try{
    const res=await fetch("https://tonapi.io/v2/accounts/"+encodeURIComponent(wallet)+"/jettons");
    const data=await res.json();
    const master=CONFIG.TAN_MASTER.toLowerCase();
    const hit=(data.balances||[]).find(j=>{
      const a=(j.jetton?.address||"").toLowerCase();
      return a===master || a.includes("26ee0f53") || a.includes(master.slice(2,10).toLowerCase());
    });
    const raw=hit?Number(hit.balance||0):0;
    state.tanHeld=raw/(10**(hit?.jetton?.decimals??CONFIG.TAN_DECIMALS));
  }catch{}
  render();
}

const SAMPLE=["HashFox","RigQueen","NonceKid","BlockDan","TanWhale","CoreLucy","NonceMax","HashIvy","RigOmar","VoltNia","BitKen","MineAva","HashLeo","TanZoe","NodeRex","ChipAmy","WattBea","PoolSid","RigNia","HashCal","TanIvy","ByteMoe","CoreAnn","MineGus","HashEbo","TanPia","NodeKal","WattIra","PoolNox","RigSol","HashUmi","TanDex","ByteRio","CoreMel","MineOli","HashYen","TanKai","NodeFay","WattLou","PoolSky","RigAbe","HashNoa","TanEve","ByteJin","CorePax","MineRae","HashTia","TanBo","NodeQuinn"];
function boardData(){
  const rows=SAMPLE.map((name,i)=>({name,tan:22000-i*370,me:false}));
  if(wallet) rows.push({name:state.name,tan:Math.floor(state.claimed+state.tan),me:true});
  return rows.sort((a,b)=>b.tan-a.tan).slice(0,50);
}
function renderBoard(){
  if(!wallet){
    document.getElementById("boardGate").textContent="Connect wallet to join the board.";
    document.getElementById("myRank").textContent="";
    document.getElementById("board").innerHTML="";
    return;
  }
  const rows=boardData();
  const rank=rows.findIndex(r=>r.me)+1;
  document.getElementById("boardGate").textContent="Top 50 · claimed + unclaimed · wallet required";
  document.getElementById("myRank").textContent=rank?("Your rank: #"+rank+" · "+fmt(rows[rank-1].tan)+" TAN"):"Not in top 50 yet";
  document.getElementById("board").innerHTML=rows.map((r,i)=>
    `<div class="row ${r.me?"me":""}"><span>#${i+1} ${r.name}${r.me?" (you)":""}</span><span>${fmt(r.tan)} TAN</span></div>`
  ).join("");
}

function tick(){
  const now=Date.now();
  if(document.visibilityState==="visible") credit((now-lastTick)/1000);
  lastTick=now; state.last=now;
  render();
}

document.getElementById("core").onclick=toggle;
document.getElementById("claimBtn").onclick=claim;
document.getElementById("wdBtn").onclick=withdraw;
document.getElementById("chestBtn").onclick=openChest;
document.getElementById("adBtn").onclick=watchAd;
document.getElementById("refBtn").onclick=invite;
tg?.MainButton?.onClick(toggle);
document.querySelectorAll(".tabs button").forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("on"));
    btn.classList.add("on");
    const tab=btn.dataset.tab;
    document.getElementById("mineView").classList.toggle("hidden", tab!=="mine");
    document.getElementById("boardView").classList.toggle("hidden", tab!=="board");
    if(tab==="board") renderBoard();
  };
});
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible") settleOffline();
  else { state.last=Date.now(); save(); }
});

try{
  if(CONFIG.ADSGRAM_BLOCK_ID && !CONFIG.ADSGRAM_BLOCK_ID.includes("YOUR-"))
    ads=window.Adsgram?.init({blockId:CONFIG.ADSGRAM_BLOCK_ID});
}catch{}
try{
  if(window.TON_CONNECT_UI){
    const tc=new TON_CONNECT_UI.TonConnectUI({manifestUrl:CONFIG.MANIFEST_URL, buttonRootId:"tc-btn"});
    tc.onStatusChange(async w=>{
      wallet=w?.account?.address||null;
      await refreshHold();
      renderBoard();
    });
  }
}catch{}

applyReferral();
settleOffline();
setInterval(tick,1000);
setInterval(refreshHold,60000);
render();
</script>
</body>
</html>

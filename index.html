<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>TAN Miner</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, sans-serif;
      background: linear-gradient(180deg, #f6d365 0%, #c9a227 50%, #8a6a12 100%);
      color: #3b2a00;
    }
    .app {
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .top {
      flex: 0 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 12px 12px 8px;
    }
    .pill, .wallet-btn {
      background: rgba(255,255,255,.4);
      border: 1px solid rgba(120,80,0,.25);
      padding: 8px 10px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 12px;
      color: #3b2a00;
    }
    .content {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 8px 16px 16px;
      -webkit-overflow-scrolling: touch;
    }
    .page { display: none; }
    .page.active { display: block; }
    .coin {
      width: 140px;
      height: 140px;
      margin: 12px auto 10px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff6c8, #e0b000 55%, #b8860b);
      display: grid;
      place-items: center;
      font-size: 36px;
      font-weight: 800;
    }
    .pending { text-align: center; font-size: 22px; color: #145a24; font-weight: 800; }
    .meta { text-align: center; font-size: 13px; margin-top: 6px; }
    .actions { margin-top: 14px; }
    button.main, button.ghost, .task button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 14px;
      font-weight: 800;
      display: block;
    }
    button.main { background: #ffe082; color: #3b2a00; margin-bottom: 8px; }
    button.ghost, .task button {
      background: rgba(255,255,255,.35);
      border: 1px solid rgba(120,80,0,.2);
      color: #3b2a00;
      margin-bottom: 8px;
    }
    .card {
      background: rgba(255,255,255,.28);
      border-radius: 16px;
      padding: 12px;
    }
    .task {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin: 8px 0;
    }
    .task button { width: auto; padding: 8px 12px; margin: 0; }
    .tabs {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
      background: rgba(160,120,20,.95);
    }
    .tabs button {
      border: 0;
      border-radius: 12px;
      padding: 12px;
      font-weight: 800;
      background: transparent;
    }
    .tabs button.active { background: rgba(255,255,255,.45); }
    #err {
      display: none;
      margin: 0 12px 8px;
      background: #7a1f1f;
      color: #fff;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="app">
    <div id="err"></div>
    <div class="top">
      <div class="pill">Lv <span id="level">1</span>/500 · <span id="hs">0.20</span> TH/s</div>
      <button class="wallet-btn" id="walletBtn">Connect Wallet</button>
    </div>

    <div class="content">
      <div id="page-mine" class="page active">
        <div class="coin">TAN</div>
        <div class="pending" id="pending">+0.0000 TAN</div>
        <div class="meta">Balance: <span id="balance">0.00</span> TAN</div>
        <div class="meta">Wallet TAN: <span id="onchain">0.00</span></div>
        <div class="meta">Boost: x<span id="boost">1.00</span></div>
        <div class="meta" id="status">Idle</div>
        <div class="actions">
          <button class="main" id="startBtn">START TAN MINING</button>
          <button class="ghost" id="claimBtn">CLAIM TAN</button>
          <button class="ghost" id="upgradeBtn">Upgrade miner</button>
        </div>
      </div>

      <div id="page-tasks" class="page">
        <h3>Tasks</h3>
        <div class="card" id="tasks"></div>
      </div>

      <div id="page-friends" class="page">
        <h3>Friends / StartApp</h3>
        <div class="card">
          <div>Your invite link:</div>
          <div id="refLink" style="word-break:break-all;font-size:13px;margin:8px 0;"></div>
          <button class="ghost" id="copyRef">Copy link</button>
          <div class="meta">Referrals: <span id="refs">0</span></div>
        </div>
      </div>
    </div>

    <div class="tabs">
      <button class="active" data-page="page-mine">Mine</button>
      <button data-page="page-tasks">Tasks</button>
      <button data-page="page-friends">Friends</button>
    </div>
  </div>

<script>
  const BOT_USERNAME = "TANMINER_BOT";
  const MAX_LEVEL = 500;
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

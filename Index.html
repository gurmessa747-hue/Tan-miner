<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tan Miner</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
  <style>
    :root {
      --bg: #070b12; --surface: #121826; --text: #f3f6fb; --muted: #8b98a8;
      --accent: #f5b942; --btn-text: #1a1408; --line: #243044; --good: #3ddc97;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: radial-gradient(1200px 500px at 50% -10%, #3a2a12, var(--bg));
      color: var(--text);
      min-height: 100vh;
      padding: calc(12px + env(safe-area-inset-top)) 16px calc(92px + env(safe-area-inset-bottom));
    }
    header, .row { display: flex; justify-content: space-between; align-items: center; }
    header { margin-bottom: 14px; }
    .brand { font-weight: 900; letter-spacing: .08em; font-size: 14px; }
    #tc-btn { transform: scale(.86); transform-origin: right center; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .card { background: color-mix(in srgb, var(--surface) 92%, black); border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
    .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
    .value { font-size: 22px; font-weight: 800; margin-top: 4px; }
    .core-wrap { display: grid; place-items: center; margin: 18px 0 10px; }
    .core {
      width: 210px; height: 210px; border-radius: 50%; border: 3px solid var(--accent);
      background: radial-gradient(circle at 38% 30%, #ffe08a, #d18a10 46%, #2a1c08 78%);
      box-shadow: 0 0 48px rgba(245,185,66,.32); color: #1a1408; font-weight: 900; font-size: 28px;
    }
    .core:active { transform: scale(.96); }
    .energy { height: 10px; background: #1b2433; border-radius: 99px; overflow: hidden; margin-top: 8px; }
    .energy > i { display: block; height: 100%; width: 0; background: var(--accent); }
    .boosts { display: grid; gap: 8px; margin: 16px 0; }
    .boost { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
    button.act {
      border: 0; border-radius: 12px; padding: 10px 12px; font-weight: 800;
      background: var(--accent); color: var(--btn-text);
    }
    button.act:disabled { opacity: .45; }
    .muted { color: var(--muted); font-size: 12px; }
    .hidden { display: none !important; }
    .board .row { padding: 12px 0; border-bottom: 1px solid var(--line); }
    .me { color: var(--accent); }
    .tabs {
      position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 8px;
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
      background: color-mix(in srgb, var(--bg) 90%, black);
    }
    .tabs button { flex: 1; border: 0; border-radius: 12px; padding: 12px; background: var(--surface); color: var(--text); font-weight: 800; }
    .tabs button.on { background: var(--accent); color: var(--btn-text); }
    .pill { color: var(--good); font-weight: 800; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <div class="brand">TAN MINER</div>
    <div id="tc-btn"></div>
  </header>

  <section id="mineView">
    <div class="stats">
      <div class="card"><div class="label">TAN mined</div><div class="value" id="bal">0</div></div>
      <div class="card"><div class="label">Hashrate</div><div class="value" id="rate">0 H/s</div></div>
    </div>
    <div class="core-wrap"><button class="core" id="core">MINE</button></div>
    <div class="label">Energy <span id="eLab">100/100</span></div>
    <div class="energy"><i id="eBar"></i></div>

    <div class="boosts">
      <div class="card boost">
        <div>
          <div class="label">Ad boost</div>
          <div id="adStatus" class="muted">Watch ad · 2x for 15 min</div>
        </div>
        <button class="act" id="adBtn">Watch ad</button>
      </div>
      <div class="card boost">
        <div>
          <div class="label">Holder boost</div>
          <div id="holdStatus" class="muted">Connect wallet & hold TAN</div>
        </div>
        <div id="holdMult" class="pill">1.00x</div>
      </div>
    </div>
    <p class="muted">Free to mine. Wallet is required for holder boost and the public board.</p>
  </section>

  <section id="boardView" class="hidden">
    <h2 style="margin: 6px 0 12px">Leaderboard</h2>
    <div class="board" id="board"></div>
  </section>

  <nav class="tabs">
    <button class="on" data-tab="mine">Mine</button>
    <button data-tab="board">Leaders</button>
  </nav>

<script>
const CONFIG = {
  APP_URL: "https://YOUR-DOMAIN.com",
  MANIFEST_URL: "https://YOUR-DOMAIN.com/tonconnect-manifest.json",
  ADSGRAM_BLOCK_ID: "YOUR-ADSGRAM-BLOCK-ID",
  TAN_MASTER: "EQ_YOUR_TAN_JETTON_MASTER_ADDRESS",
  TAN_DECIMALS: 9,
  AD_MS: 15 * 60 * 1000,
  ALLOW_AD_SIMULATION: true, // set false after AdsGram is approved
  SHARE_TEXT: "Mine TAN with me"
};

const tg = window.Telegram?.WebApp;
const user = tg?.initDataUnsafe?.user;
tg?.ready(); tg?.expand();
tg?.setHeaderColor?.("secondary_bg_color");
tg?.setBackgroundColor?.("bg_color");
const theme = tg?.themeParams || {};
const root = document.documentElement;
if (theme.bg_color) root.style.setProperty("--bg", theme.bg_color);
if (theme.secondary_bg_color) root.style.setProperty("--surface", theme.secondary_bg_color);
if (theme.text_color) root.style.setProperty("--text", theme.text_color);
if (theme.hint_color) root.style.setProperty("--muted", theme.hint_color);
if (theme.button_color) root.style.setProperty("--accent", theme.button_color);
if (theme.button_text_color) root.style.setProperty("--btn-text", theme.button_text_color);

const KEY = "tan-miner-all-v1";
const state = load();
let wallet = null;
let ads = null;
let tonConnect = null;

function base() {
  return {
    tan: 0, energy: 100, last: Date.now(), taps: 0,
    adBoostUntil: 0, tanHeld: 0,
    name: user?.username || user?.first_name || "Miner"
  };
}
function load() {
  try { return Object.assign(base(), JSON.parse(localStorage.getItem(KEY) || "{}")); }
  catch { return base(); }
}
function save() { localStorage.setItem(KEY, JSON.stringify(state)); }

function holderMultiplier(bal) {
  if (bal >= 100000) return 2;
  if (bal >= 10000) return 1.5;
  if (bal >= 1000) return 1.25;
  if (bal >= 100) return 1.1;
  return 1;
}
function multipliers() {
  const ad = Date.now() < state.adBoostUntil ? 2 : 1;
  const hold = holderMultiplier(state.tanHeld);
  return { ad, hold, total: ad * hold };
}
function regen() {
  const now = Date.now();
  const gained = Math.floor((now - state.last) / 3000);
  if (gained > 0) {
    state.energy = Math.min(100, state.energy + gained);
    state.last += gained * 3000;
  }
}
function hashrate() { return (8 + Math.min(state.taps, 200)) * multipliers().total; }
function fmt(n) { return Math.floor(n).toLocaleString(); }
function left(ms) {
  const s = Math.max(0, Math.ceil(ms / 1000));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}

function render() {
  regen();
  const m = multipliers();
  document.getElementById("bal").textContent = fmt(state.tan);
  document.getElementById("rate").textContent = hashrate().toFixed(0) + " H/s";
  document.getElementById("eLab").textContent = state.energy + "/100";
  document.getElementById("eBar").style.width = state.energy + "%";
  const adOn = Date.now() < state.adBoostUntil;
  document.getElementById("adStatus").textContent = adOn
    ? ("ON · " + left(state.adBoostUntil - Date.now()) + " left")
    : "Watch ad · 2x for 15 min";
  document.getElementById("adBtn").disabled = adOn;
  document.getElementById("holdMult").textContent = m.hold.toFixed(2) + "x";
  document.getElementById("holdStatus").textContent = wallet
    ? ("Holding " + fmt(state.tanHeld) + " TAN")
    : "Connect wallet & hold TAN";
  tg?.MainButton?.setText(state.energy > 0 ? "Start Mining" : "Energy empty");
  tg?.MainButton?.show();
  save();
}

function mine() {
  regen();
  if (state.energy <= 0) { tg?.HapticFeedback?.notificationOccurred("error"); return; }
  state.energy -= 1;
  state.taps += 1;
  state.tan += (1 + Math.floor(state.taps / 50)) * multipliers().total;
  tg?.HapticFeedback?.impactOccurred("light");
  render();
}

async function watchAd() {
  if (Date.now() < state.adBoostUntil) return;
  const grant = () => {
    state.adBoostUntil = Date.now() + CONFIG.AD_MS;
    state.energy = Math.min(100, state.energy + 20);
    tg?.HapticFeedback?.notificationOccurred("success");
    render();
  };
  if (ads) {
    try { await ads.show(); grant(); return; }
    catch { tg?.HapticFeedback?.notificationOccurred("error"); if (!CONFIG.ALLOW_AD_SIMULATION) return; }
  }
  if (CONFIG.ALLOW_AD_SIMULATION) grant();
}

async function refreshHold() {
  if (!wallet || !CONFIG.TAN_MASTER.startsWith("EQ") && !CONFIG.TAN_MASTER.startsWith("UQ")) {
    state.tanHeld = 0; render(); return;
  }
  try {
    const res = await fetch("https://tonapi.io/v2/accounts/" + encodeURIComponent(wallet) + "/jettons");
    const data = await res.json();
    const hit = (data.balances || []).find(j =>
      (j.jetton?.address || "").toLowerCase().includes(CONFIG.TAN_MASTER.slice(2, 10).toLowerCase())
      || j.jetton?.address === CONFIG.TAN_MASTER
    );
    const raw = hit ? Number(hit.balance || 0) : 0;
    state.tanHeld = raw / (10 ** (hit?.jetton?.decimals ?? CONFIG.TAN_DECIMALS));
  } catch { /* keep last known */ }
  render();
}

function boardRows() {
  const me = { name: state.name, tan: Math.floor(state.tan), me: true };
  const sample = [
    { name: "HashFox", tan: 18420 }, { name: "RigQueen", tan: 15110 },
    { name: "NonceKid", tan: 9904 }, { name: "BlockDan", tan: 7420 }
  ];
  return [...sample, me].sort((a, b) => b.tan - a.tan).slice(0, 10);
}
function renderBoard() {
  document.getElementById("board").innerHTML = boardRows().map((r, i) =>
    `<div class="row ${r.me ? "me" : ""}"><span>#${i + 1} ${r.name}${r.me ? " (you)" : ""}</span><span>${fmt(r.tan)} TAN</span></div>`
  ).join("");
}

document.getElementById("core").onclick = mine;
document.getElementById("adBtn").onclick = watchAd;
tg?.MainButton?.onClick(mine);
document.querySelectorAll(".tabs button").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("on"));
    btn.classList.add("on");
    const tab = btn.dataset.tab;
    document.getElementById("mineView").classList.toggle("hidden", tab !== "mine");
    document.getElementById("boardView").classList.toggle("hidden", tab !== "board");
    if (tab === "board") renderBoard();
  };
});

try {
  if (CONFIG.ADSGRAM_BLOCK_ID && !CONFIG.ADSGRAM_BLOCK_ID.includes("YOUR-")) {
    ads = window.Adsgram?.init({ blockId: CONFIG.ADSGRAM_BLOCK_ID });
  }
} catch {}

try {
  if (window.TON_CONNECT_UI) {
    tonConnect = new TON_CONNECT_UI.TonConnectUI({
      manifestUrl: CONFIG.MANIFEST_URL,
      buttonRootId: "tc-btn"
    });
    tonConnect.onStatusChange(async (w) => {
      wallet = w?.account?.address || null;
      await refreshHold();
    });
  }
} catch {}

setInterval(render, 1000);
setInterval(refreshHold, 60000);
render();
</script>
</body>
</html>
